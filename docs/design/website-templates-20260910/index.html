<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YimiLife · 全站 UI 模板评审</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef0;color:#18343c;font:14px Arial,"Microsoft YaHei",sans-serif}header{padding:12px 22px;background:#12333c;color:white;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header b{font-size:16px}header small{color:#bcdbdf}nav{display:flex;gap:5px;flex-wrap:wrap}button,a{font:inherit}nav button,.views button{padding:10px 14px;border:1px solid #b7c9cd;background:white;color:#24444d;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#087f85;color:white;border-color:#087f85}.tools{padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;background:white;border-bottom:1px solid #cbd8dc}.views{display:flex;gap:5px}.tools a{color:#075e63}.hint{margin:0;padding:9px 22px;font-size:12px;color:#52676d;line-height:1.6}iframe{display:block;border:0;background:white;width:100%;height:calc(100dvh - 154px);min-height:450px;margin:auto;transition:width .2s}iframe.mobile{width:390px;max-width:100%;border:1px solid #bdcdd1;border-radius:14px 14px 0 0}iframe.tablet{width:768px;max-width:100%}@media(max-width:600px){header{padding:10px 14px;gap:10px}header small{display:none}.tools{padding:8px 14px;align-items:flex-start}.views button{padding:8px}.hint{padding:7px 14px}iframe{height:calc(100dvh - 192px)}.tools a{font-size:12px}nav button{padding:9px 10px}}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,.tools,.hint{flex-shrink:0}iframe{height:0;min-height:0;flex:1;margin:0 auto}header nav{gap:4px}header nav button{padding:9px 11px;font-size:12px}@media(max-width:600px){header nav{flex-wrap:nowrap;width:100%;overflow-x:auto;padding-bottom:4px}header nav button{white-space:nowrap;flex-shrink:0}.hint{font-size:10px}iframe{height:0;min-height:0}}</style></head><body><header><b>YimiLife / UI 模板评审</b><small>页面布局已确认 · 素材待补</small><nav aria-label="模板切换"><button data-page="home" aria-pressed="true">01 首页</button><button data-page="products" aria-pressed="false">02 产品总览</button><button data-page="category" aria-pressed="false">03 体温计品类</button><button data-page="detail" aria-pressed="false">04 型号详情</button><button data-page="about" aria-pressed="false">05 公司与研发</button><button data-page="manufacturing" aria-pressed="false">06 制造与质量</button><button data-page="oem" aria-pressed="false">07 OEM/ODM</button><button data-page="contact" aria-pressed="false">08 Contact</button><button data-page="pulse" aria-pressed="false">09 血氧仪品类</button><button data-page="bp" aria-pressed="false">10 血压计品类</button></nav></header><div class="tools"><div class="views" aria-label="预览尺寸"><button data-size="desktop" aria-pressed="true">桌面</button><button data-size="tablet" aria-pressed="false">平板</button><button data-size="mobile" aria-pressed="false">手机</button></div><a href="design-notes.html" target="_blank">设计依据与评审说明 ↗</a></div><p class="hint">内部模板，非正式网站。图片、型号与资料占位后填；英文通用文案为排版草稿，新增品类名称保持中文。手机模式为 390px；Contact 只演示表单状态，不发送数据。</p><iframe title="YimiLife 网站模板预览" src="home.html"></iframe><script>const frame=document.querySelector('iframe');const requested=new URLSearchParams(location.search).get('page');if(['home','products','category','detail','about','manufacturing','oem','contact','pulse','bp'].includes(requested))frame.src=requested+'.html';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',x===b));frame.src=b.dataset.page+'.html'});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b));frame.className=b.dataset.size});frame.onload=()=>{let p=frame.contentWindow.location.pathname.split('/').pop().replace('.html','');if(document.querySelector('[data-page="'+p+'"]')){const url=new URL(location.href);url.searchParams.set('page',p);history.replaceState(null,'',url)}document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===p))};</script></body></html>
